name: Validate CRM review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - name: Build production-targeted review bundle without deployment
        env:
          VITE_API_URL: https://api.reygom.com
          VITE_APP_ENV: PROD
          VITE_APP_VERSION: review-${{ github.sha }}
        run: pnpm run build
